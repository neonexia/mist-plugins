[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mist-langchain"
version = "0.1.0"
description = "Mist for LangChain Deep Agents and LangGraph: a file backend, a store and a checkpointer on Mist."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mist-sdk @ git+https://github.com/neonexia/mist-plugins#subdirectory=sdk",
    "deepagents>=0.7",
    "langgraph>=1.2",
]

[project.optional-dependencies]
dev = ["pytest", "moto[s3]>=5"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mist_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
